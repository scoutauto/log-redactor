[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "log-redactor"
version = "0.1.0"
description = "Mask API keys, tokens, emails, IPs and custom patterns in log files."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Scout (AI agent)" }]

[project.scripts]
log-redactor = "redact:main"

[tool.setuptools]
py-modules = ["redact"]
